name: CI

on:
  push:
    branches: [main, day6]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      - run: npm run build

      # The governance tarball is the library and nothing else (WP50, `38-…` §4.1).
      - run: node scripts/check-governance-pack.mjs

      # The Python reader over a bundle (WP73, `62-THE-TAIL.md` §4.4) — the script skips itself when no python3 is present.
      - run: npm run example:python

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npm run e2e

  # The visual-regression pass (WP71, docs/design-day2/60-CONTROL-ROOM-V2.md §4.2):
  # every Workshop route and the Kit's screens shot on the fixture corpus and
  # diffed against the Linux baselines committed under e2e/__screenshots__/linux/.
  # A shape change re-baselines deliberately: run the project with
  # --update-snapshots here, download the artefact, commit it with a dated note.
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npx turbo run build --filter=@craftabot/workbench^...

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # TEMP (WP100–WP102): re-take every Linux Workshop baseline — the journeys pages, the Pipeline's canvas, the Studio, the fourth journey; reverted in the next commit.
      - run: npx playwright test --project=visual --update-snapshots
        working-directory: apps/workbench

      - name: Upload the screenshots and the diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual
          path: |
            apps/workbench/e2e/__screenshots__
            apps/workbench/test-results
          if-no-files-found: warn

  # The three sections of the site (WP69, docs/design-day2/59-EDITIONS.md §4.5):
  # each edition built under its own base and within its own budget, each
  # smoke spec run against its folder, the three folders uploaded as one
  # artefact for a static host. `full` — the default build — is the build
  # job's above; nothing here changes it.
  editions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # The packages the app imports, built once; the editions build the app three times.
      - run: npx turbo run build --filter=@craftabot/workbench^...

      - run: npm run build:editions

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npm run e2e:editions

      - name: Upload the three sections
        uses: actions/upload-artifact@v4
        with:
          name: site-editions
          path: |
            apps/workbench/build/simulator
            apps/workbench/build/workshop
            apps/workbench/build/playground
          if-no-files-found: error

  # The guardrail regression suite as a file (WP38, docs/design-day2/28-CAMPAIGNS.md
  # §4.8): the four shipped governance scenarios, guarded and unguarded, every
  # cell scripted — no key, no network. Fails the build when a guard is removed
  # from a scenario that expects one. The SARIF goes to code scanning so a failed
  # gate shows up where security findings do.
  campaign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Run the baseline campaign
        run: >
          npm run craftabot -- campaign --file campaigns/injection-baseline.json --strict --egress none
          --out campaign-out --junit campaign-out/junit.xml --sarif campaign-out/results.sarif
          --markdown campaign-out/scorecard.md

      # The Advice Desk baseline (WP60, `49-FS-ADVICE.md` §4.7): thirty conduct
      # scenarios under no guard, the seven cards, and the cards with a classifier
      # and a hosted guard offline — 720 scripted cells. Fails the build when the
      # suitability card is removed.
      - name: Run the Advice Desk baseline
        run: >
          npm run craftabot -- campaign --file campaigns/fs-advice-baseline.json --strict --egress none
          --out campaign-out/fs-advice --junit campaign-out/fs-advice/junit.xml --sarif campaign-out/fs-advice/results.sarif
          --markdown campaign-out/fs-advice/scorecard.md

      # The Fraud Desk baseline (WP62, `51-FS-FRAUD.md` §4.6): the first report with a confusion
      # matrix and a parity gate. Fails the build when Never tip off is removed.
      - name: Run the Fraud Desk baseline
        run: >
          npm run craftabot -- campaign --file campaigns/fs-fraud-baseline.json --strict --egress none
          --out campaign-out/fs-fraud --junit campaign-out/fs-fraud/junit.xml --sarif campaign-out/fs-fraud/results.sarif
          --markdown campaign-out/fs-fraud/scorecard.md

      # The Lending Desk baseline (WP63, `52-FS-LENDING.md` §4.6): the first matched parity gate.
      # Fails the build when No decision before affordability is removed.
      # The lending book (WP80, `73-…` §4): the loan book of a 500-customer population through the
      # lending journey under the five reference configurations; rules-only agrees with the rule on
      # every row, the bots too; the human-load rows by autonomy level are in the scorecard.
      - name: Run the lending book campaign
        run: >
          npm run craftabot -- campaign --file campaigns/fs-lending-book.json --strict --egress none
          --out campaign-out/fs-lending-book --junit campaign-out/fs-lending-book/junit.xml
          --sarif campaign-out/fs-lending-book/results.sarif --markdown campaign-out/fs-lending-book/scorecard.md

      # The fraud and advice books (WP85, `76-…` §5): the alert book and the advice-request register
      # through their journeys under the five reference configurations, at reduced size.
      - name: Run the fraud book campaign
        run: >
          npm run craftabot -- campaign --file campaigns/fs-fraud-book.json --strict --egress none
          --out campaign-out/fs-fraud-book --junit campaign-out/fs-fraud-book/junit.xml
          --sarif campaign-out/fs-fraud-book/results.sarif --markdown campaign-out/fs-fraud-book/scorecard.md

      - name: Run the advice book campaign
        run: >
          npm run craftabot -- campaign --file campaigns/fs-advice-book.json --strict --egress none
          --out campaign-out/fs-advice-book --junit campaign-out/fs-advice-book/junit.xml
          --sarif campaign-out/fs-advice-book/results.sarif --markdown campaign-out/fs-advice-book/scorecard.md

      # The reference experiments (WP90, `80-…` §4): every design under experiments/ at a reduced
      # population, each reduced result held to the committed full-size one's shape — the same
      # metrics, factors and levels, a verdict from the same three — never its values.
      - name: Run the reference experiments (reduced)
        run: >
          for f in experiments/*.json; do
          id=$(basename "$f" .json);
          npm run craftabot -- experiment run --file "$f" --size 200 --egress none --jobs 2
          --out "campaign-out/experiments/$id" || exit 1;
          mkdir -p "campaign-out/experiments-shape/$id";
          cp "campaign-out/experiments/$id/$id.experiment-result.json" "campaign-out/experiments-shape/$id/";
          done
      - name: Hold the reduced results to the committed shape
        run: node scripts/experiment-shape.mjs docs/evidence campaign-out/experiments-shape

      # A day at the bank (WP83, `71-THE-CLOCK.md` §5; three desks since WP85, `76-…` §5): the lending,
      # fraud and advice desks work a day's applications, alerts and requests over a 500-customer
      # population at Infinity; the BankRun and every run are uploaded with the rest.
      - name: Run a day at the bank
        run: >
          npm run craftabot -- bank run --day 2026-06-10 --desks campaigns/desks/bank-day.json
          --population 1 --size 500 --egress none --out campaign-out/bank-day

      - name: Run the Lending Desk baseline
        run: >
          npm run craftabot -- campaign --file campaigns/fs-lending-baseline.json --strict --egress none
          --out campaign-out/fs-lending --junit campaign-out/fs-lending/junit.xml --sarif campaign-out/fs-lending/results.sarif
          --markdown campaign-out/fs-lending/scorecard.md

      # The Complaints Desk baseline (WP72, `61-LAST-DECKS.md` §4.2): the complaints-and-redress
      # deck, unguarded and with the redress card — 168 scripted cells. Fails the build when
      # the adversary's over-payment stops landing unguarded, or the optimal plan stops resolving.
      - name: Run the Complaints Desk baseline
        run: >
          npm run craftabot -- campaign --file campaigns/fs-complaints-baseline.json --strict --egress none
          --out campaign-out/fs-complaints --junit campaign-out/fs-complaints/junit.xml --sarif campaign-out/fs-complaints/results.sarif
          --markdown campaign-out/fs-complaints/scorecard.md

      # WP68 (`57-HARNESS-AT-SCALE.md` §4.6): two thousand scripted cells through the worker pool, timed by the step.
      - name: The scale check — 2,016 cells on four workers
        run: >
          npm run craftabot -- campaign --file campaigns/injection-baseline.json --seeds 1-63 --jobs 4
          --no-keep-runs --strict --egress none --out campaign-out/scale

      - name: Upload the campaign report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-out
          path: campaign-out
          if-no-files-found: warn

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: campaign-out/results.sarif
          category: campaign

      - name: Upload the Advice Desk SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: campaign-out/fs-advice/results.sarif
          category: campaign-fs-advice

      - name: Upload the Fraud Desk SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: campaign-out/fs-fraud/results.sarif
          category: campaign-fs-fraud

      - name: Upload the Lending Desk SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: campaign-out/fs-lending/results.sarif
          category: campaign-fs-lending
