name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Linux baselines (WP131's follow-up): run by hand with update_snapshots on,
  # the visual job rewrites every Linux screenshot that differs and uploads them in
  # its artefact, to be reviewed and committed. The committed baselines are CI's own
  # rendering; a container's fonts differ (`101-…` §8, WP130).
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Rewrite the Linux visual baselines and upload them'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      - run: npm run build

      # The governance tarball is the library and nothing else (WP50, `38-…` §4.1).
      - run: node scripts/check-governance-pack.mjs

      # 1.0.0 installs from its tarball (WP126): core, metrics and governance packed, installed into the example, the readers importable.
      - run: node scripts/check-governance-install.mjs

      # The Python reader over a bundle (WP73, `62-THE-TAIL.md` §4.4) — the script skips itself when no python3 is present.
      - run: npm run example:python

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npm run e2e

  # The visual-regression pass (WP71, docs/design-day2/60-CONTROL-ROOM-V2.md §4.2):
  # every Workshop route and the Kit's screens shot on the fixture corpus and
  # diffed against the Linux baselines committed under e2e/__screenshots__/linux/.
  # A shape change re-baselines deliberately: run the project with
  # --update-snapshots here, download the artefact, commit it with a dated note.
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npx turbo run build --filter=@craftabot/workbench^...

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Straight at the workspace, so --update-snapshots reaches Playwright rather than npm.
      - run: npm run e2e:visual --workspace=apps/workbench ${{ inputs.update_snapshots && '-- --update-snapshots' || '' }}

      - name: Upload the screenshots and the diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual
          path: |
            apps/workbench/e2e/__screenshots__
            apps/workbench/test-results
          if-no-files-found: warn

  # The three sections of the site (WP69, docs/design-day2/59-EDITIONS.md §4.5):
  # each edition built under its own base and within its own budget, each
  # smoke spec run against its folder, the three folders uploaded as one
  # artefact for a static host. `full` — the default build — is the build
  # job's above; nothing here changes it.
  editions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # The packages the app imports, built once; the editions build the app three times.
      - run: npx turbo run build --filter=@craftabot/workbench^...

      - run: npm run build:editions

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npm run e2e:editions

      - name: Upload the three sections
        uses: actions/upload-artifact@v4
        with:
          name: site-editions
          path: |
            apps/workbench/build/simulator
            apps/workbench/build/workshop
            apps/workbench/build/playground
          if-no-files-found: error

  # The guardrail regression suite as a file (WP38, docs/design-day2/28-CAMPAIGNS.md
  # §4.8): the four shipped governance scenarios, guarded and unguarded, every
  # cell scripted — no key, no network. Fails the build when a guard is removed
  # from a scenario that expects one. The SARIF goes to code scanning so a failed
  # gate shows up where security findings do.
  campaign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Run the baseline campaign
        run: >
          npm run craftabot -- campaign --file campaigns/injection-baseline.json --strict --egress none
          --out campaign-out --junit campaign-out/junit.xml --sarif campaign-out/results.sarif
          --markdown campaign-out/scorecard.md

      # The agent-security baseline (WP151–WP152, `111-TESTABLE-CONTROLS-PLAN.md` §4):
      # each attack lands unguarded and is stopped by the component built for it.
      - name: Run the agent-security baseline
        run: >
          npm run craftabot -- campaign --file campaigns/agent-security-baseline.json --strict --egress none
          --out campaign-out/agent-security

      # The Advice Desk baseline (WP60, `49-FS-ADVICE.md` §4.7): thirty conduct
      # scenarios under no guard, the seven cards, and the cards with a classifier
      # and a hosted guard offline — 720 scripted cells. Fails the build when the
      # suitability card is removed.
      - name: Run the Advice Desk baseline
        run: >
          npm run craftabot -- campaign --file campaigns/fs-advice-baseline.json --strict --egress none
          --out campaign-out/fs-advice --junit campaign-out/fs-advice/junit.xml --sarif campaign-out/fs-advice/results.sarif
          --markdown campaign-out/fs-advice/scorecard.md

      # The Fraud Desk baseline (WP62, `51-FS-FRAUD.md` §4.6): the first report with a confusion
      # matrix and a parity gate. Fails the build when Never tip off is removed.
      - name: Run the Fraud Desk baseline
        run: >
          npm run craftabot -- campaign --file campaigns/fs-fraud-baseline.json --strict --egress none
          --out campaign-out/fs-fraud --junit campaign-out/fs-fraud/junit.xml --sarif campaign-out/fs-fraud/results.sarif
          --markdown campaign-out/fs-fraud/scorecard.md

      # The Lending Desk baseline (WP63, `52-FS-LENDING.md` §4.6): the first matched parity gate.
      # Fails the build when No decision before affordability is removed.
      # WP135 (`110-…` G101): against the committed baseline, so its no-regression gate is decided —
      # the bank's SS1/23 row cites it. Re-take the baseline when the book is meant to change.
      # The lending book (WP80, `73-…` §4): the loan book of a 500-customer population through the
      # lending journey under the five reference configurations; rules-only agrees with the rule on
      # every row, the bots too; the human-load rows by autonomy level are in the scorecard.
      - name: Run the lending book campaign
        run: >
          npm run craftabot -- campaign --file campaigns/fs-lending-book.json --strict --egress none
          --baseline campaigns/baselines/fs-lending-book.campaign-report.json
          --out campaign-out/fs-lending-book --junit campaign-out/fs-lending-book/junit.xml
          --sarif campaign-out/fs-lending-book/results.sarif --markdown campaign-out/fs-lending-book/scorecard.md

      # The lending book, reviewed (WP156, `111-…` §4): a case handler overruling a fallible bot at
      # Level 4, and saying why at the reviewer model's stated rate — the `override-reason` gate.
      - name: Run the reviewed lending book
        run: >
          npm run craftabot -- campaign --file campaigns/fs-lending-reviewed.json --strict --egress none
          --out campaign-out/fs-lending-reviewed

      # The fraud and advice books (WP85, `76-…` §5): the alert book and the advice-request register
      # through their journeys under the five reference configurations, at reduced size.
      - name: Run the fraud book campaign
        run: >
          npm run craftabot -- campaign --file campaigns/fs-fraud-book.json --strict --egress none
          --out campaign-out/fs-fraud-book --junit campaign-out/fs-fraud-book/junit.xml
          --sarif campaign-out/fs-fraud-book/results.sarif --markdown campaign-out/fs-fraud-book/scorecard.md

      - name: Run the advice book campaign
        run: >
          npm run craftabot -- campaign --file campaigns/fs-advice-book.json --strict --egress none
          --out campaign-out/fs-advice-book --junit campaign-out/fs-advice-book/junit.xml
          --sarif campaign-out/fs-advice-book/results.sarif --markdown campaign-out/fs-advice-book/scorecard.md

      # The reference experiments (WP90, `80-…` §4; the eighth, servicing-readers, since WP119 — hence the
      # typesafe pack's --config, which adds that pack to the defaults and changes nothing the seven run): every design under experiments/ at a reduced
      # population, each reduced result held to the committed full-size one's shape — the same
      # metrics, factors and levels, a verdict from the same three — never its values. A design over
      # scenarios (WP150's `controls`) has no population to reduce and runs whole. `gate-presets` (WP157)
      # runs under the Gate's own config, which installs its presets beside the defaults.
      - name: Run the reference experiments (reduced)
        run: >
          for f in experiments/*.json; do
          id=$(basename "$f" .json);
          size=$(node -e "const e=require('./$f');process.stdout.write(e.design.template.source?'--size 200':'')");
          config=packages/packs/typesafe/craftabot.config.mjs;
          if [ "$id" = "gate-presets" ]; then config=packages/gate/craftabot.config.mjs; fi;
          npm run craftabot -- experiment run --config "$config" --file "$f" $size --egress none --jobs 2
          --out "campaign-out/experiments/$id" || exit 1;
          mkdir -p "campaign-out/experiments-shape/$id";
          cp "campaign-out/experiments/$id/$id.experiment-result.json" "campaign-out/experiments-shape/$id/";
          done
      - name: Hold the reduced results to the committed shape
        run: node scripts/experiment-shape.mjs docs/evidence campaign-out/experiments-shape

      # WP168 (112-REAL-ENOUGH-PLAN.md §5): the live tier. Each design under experiments/live/ is derived from its
      # base design (so the two cannot drift), then replayed from its committed cassette — no key, no network —
      # and the replay must reproduce the committed result exactly, every effect to the last digit.
      - name: Check the live designs against their base designs
        run: node scripts/live-designs.mjs --check
      - name: Replay the live tier from its cassettes
        run: node scripts/live-check.mjs
      - name: Check the live column is the one the results and cassettes give
        run: node scripts/live-column.mjs --check
      # The 35B suite (113 §12): the same designs with the 35B in the brain's seat, in folders of their own. Until it is recorded there are
      # no cassettes to replay and the check says so.
      - name: Check the 35B designs against their base designs
        run: node scripts/live-designs.mjs --suite quick --check
      - name: Replay the 35B suite from its cassettes
        run: node scripts/live-check.mjs --suite quick
      - name: Check the 35B column is the one the results and cassettes give
        run: node scripts/live-column.mjs --suite quick --check
      - name: Check the 122B and 35B comparison is the one the two suites give
        run: node scripts/live-compare.mjs --check
      # WP198 (114 §6): the oversight suite — a person who says no at a lending and a complaints decision, on the 122B.
      - name: Check the oversight designs against their base designs
        run: node scripts/live-designs.mjs --suite oversight --check
      - name: Replay the oversight suite from its cassettes
        run: node scripts/live-check.mjs --suite oversight
      - name: Check the pressure and contract designs against their base designs
        run: node scripts/live-designs.mjs --suite pressure --check && node scripts/live-designs.mjs --suite contract --check
      - name: Replay the pressure and contract suites from their cassettes
        run: node scripts/live-check.mjs --suite pressure && node scripts/live-check.mjs --suite contract
      - name: Check the measured error rates are the ones the live results give (WP197)
        run: node scripts/measured-error-rates.mjs --check
      - name: Check the measured habits are the ones the cassettes give (plan 114 WP203)
        run: node scripts/measured-habits.mjs --check
      - name: Check the decision dossiers are what the committed evidence folds to (plan 114 WP214)
        run: npm run craftabot -- dossier --check
      - name: Check the recommendations are what the dossiers say (plan 114 WP213)
        run: npm run craftabot -- recommend --check

      # WP123 (106-BENCHMARK.md §6): every guard over the seven adversarial corpora, the stand-ins unmeasured.
      - name: Run the reference benchmark
        run: npm run craftabot -- benchmark run benchmarks/bank-adversarial.json --out campaign-out/benchmark

      # A day at the bank (WP83, `71-THE-CLOCK.md` §5; three desks since WP85, `76-…` §5; seven desks since WP106, `92-…` §5):
      # the lending, fraud, advice, complaints, onboarding, disputes, collections and servicing desks work a day's applications, alerts and requests over a 500-customer
      # population at Infinity; the BankRun and every run are uploaded with the rest.
      - name: Run a day at the bank
        run: >
          npm run craftabot -- bank run --day 2026-06-10 --desks campaigns/desks/bank-day.json
          --population 1 --size 500 --egress none --out campaign-out/bank-day

      - name: Run the Lending Desk baseline
        run: >
          npm run craftabot -- campaign --file campaigns/fs-lending-baseline.json --strict --egress none
          --out campaign-out/fs-lending --junit campaign-out/fs-lending/junit.xml --sarif campaign-out/fs-lending/results.sarif
          --markdown campaign-out/fs-lending/scorecard.md

      # The Onboarding Desk baseline (WP103, `95-FS-ONBOARDING.md` §4.6): the tipping-off pair as
      # gates — the match named unguarded by the adversary, contained under the cards on every brain.
      # Fails the build when A hit is never said is removed.
      - name: Run the Onboarding Desk baseline
        run: >
          npm run craftabot -- campaign --file campaigns/fs-onboarding-baseline.json --strict --egress none
          --out campaign-out/fs-onboarding --junit campaign-out/fs-onboarding/junit.xml --sarif campaign-out/fs-onboarding/results.sarif
          --markdown campaign-out/fs-onboarding/scorecard.md

      - name: Run the onboarding book campaign
        run: >
          npm run craftabot -- campaign --file campaigns/fs-onboarding-book.json --strict --egress none
          --out campaign-out/fs-onboarding-book --junit campaign-out/fs-onboarding-book/junit.xml
          --sarif campaign-out/fs-onboarding-book/results.sarif --markdown campaign-out/fs-onboarding-book/scorecard.md

      # The Disputes Desk baseline (WP104, `90-FS-DISPUTES.md` §6): the hold, the limit and the
      # classification as gates. Fails the build when Within the limit is removed.
      - name: Run the Disputes Desk baseline
        run: >
          npm run craftabot -- campaign --file campaigns/fs-disputes-baseline.json --strict --egress none
          --out campaign-out/fs-disputes --junit campaign-out/fs-disputes/junit.xml --sarif campaign-out/fs-disputes/results.sarif
          --markdown campaign-out/fs-disputes/scorecard.md

      - name: Run the disputes book campaign
        run: >
          npm run craftabot -- campaign --file campaigns/fs-disputes-book.json --strict --egress none
          --out campaign-out/fs-disputes-book --junit campaign-out/fs-disputes-book/junit.xml
          --sarif campaign-out/fs-disputes-book/results.sarif --markdown campaign-out/fs-disputes-book/scorecard.md

      # The Collections Desk baseline (WP105, `91-FS-COLLECTIONS.md` §6): the circumstances, the notice and
      # the matched pair as gates. Fails the build when No default notice before circumstances is removed.
      - name: Run the Collections Desk baseline
        run: >
          npm run craftabot -- campaign --file campaigns/fs-collections-baseline.json --strict --egress none
          --out campaign-out/fs-collections --junit campaign-out/fs-collections/junit.xml --sarif campaign-out/fs-collections/results.sarif
          --markdown campaign-out/fs-collections/scorecard.md

      - name: Run the arrears book campaign
        run: >
          npm run craftabot -- campaign --file campaigns/fs-collections-book.json --strict --egress none
          --out campaign-out/fs-collections-book --junit campaign-out/fs-collections-book/junit.xml
          --sarif campaign-out/fs-collections-book/results.sarif --markdown campaign-out/fs-collections-book/scorecard.md

      # The Servicing Desk baseline (WP106, `92-FS-SERVICING.md` §6): the verification, the disclosure and
      # the needs met as gates. Fails the build when Verify before act is removed.
      - name: Run the Servicing Desk baseline
        run: >
          npm run craftabot -- campaign --file campaigns/fs-servicing-baseline.json --strict --egress none
          --out campaign-out/fs-servicing --junit campaign-out/fs-servicing/junit.xml --sarif campaign-out/fs-servicing/results.sarif
          --markdown campaign-out/fs-servicing/scorecard.md

      - name: Run the servicing book campaign
        run: >
          npm run craftabot -- campaign --file campaigns/fs-servicing-book.json --strict --egress none
          --out campaign-out/fs-servicing-book --junit campaign-out/fs-servicing-book/junit.xml
          --sarif campaign-out/fs-servicing-book/results.sarif --markdown campaign-out/fs-servicing-book/scorecard.md

      # The Complaints Desk baseline (WP72, `61-LAST-DECKS.md` §4.2): the complaints-and-redress
      # deck, unguarded and with the redress card — 168 scripted cells. Fails the build when
      # the adversary's over-payment stops landing unguarded, or the optimal plan stops resolving.
      - name: Run the Complaints Desk baseline
        run: >
          npm run craftabot -- campaign --file campaigns/fs-complaints-baseline.json --strict --egress none
          --out campaign-out/fs-complaints --junit campaign-out/fs-complaints/junit.xml --sarif campaign-out/fs-complaints/results.sarif
          --markdown campaign-out/fs-complaints/scorecard.md

      # WP68 (`57-HARNESS-AT-SCALE.md` §4.6): two thousand scripted cells through the worker pool, timed by the step.
      - name: The scale check — 2,016 cells on four workers
        run: >
          npm run craftabot -- campaign --file campaigns/injection-baseline.json --seeds 1-63 --jobs 4
          --no-keep-runs --strict --egress none --out campaign-out/scale

      - name: Upload the campaign report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-out
          path: campaign-out
          if-no-files-found: warn

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: campaign-out/results.sarif
          category: campaign

      - name: Upload the Advice Desk SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: campaign-out/fs-advice/results.sarif
          category: campaign-fs-advice

      - name: Upload the Fraud Desk SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: campaign-out/fs-fraud/results.sarif
          category: campaign-fs-fraud

      - name: Upload the Lending Desk SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: campaign-out/fs-lending/results.sarif
          category: campaign-fs-lending
