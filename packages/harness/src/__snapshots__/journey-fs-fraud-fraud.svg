<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1534 332" width="1534" height="332" role="img" aria-labelledby="journey-title" font-family="system-ui, sans-serif" font-size="11" fill="currentColor" stroke="currentColor">
<title id="journey-title">The alert journey: Alert (the rules), Triage (the assistant), Contact (the assistant), Decision (the assistant), Restriction recorded (the rules), Suspicious-activity report (a colleague), Report filed (the rules), Closing note (the rules). Edges: alert to triage; triage to contact; contact to decision; decision to restriction on release / hold / block-card / freeze / escalate; restriction to sar on depends on the case; sar to filing on skip / file; filing to note; note to end on depends on the case.</title>
<style>.lane{fill:none;stroke-opacity:.35}.lane-label{stroke:none;font-weight:700}.edge{fill:none;stroke-width:1.5}.edge--case{stroke-dasharray:4 3}.edge--taken{stroke-width:3}.edge-label{stroke:none}.node{fill:none;stroke-width:1.5}.node--lit{stroke-width:3}.node--irreversible{stroke-dasharray:2 2}.node-label{stroke:none;text-anchor:middle}.point{fill:none;stroke-width:1.5}.end{stroke-width:3}</style>
<rect class="lane lane--assistant" x="0" y="16" width="1534" height="100"/>
<text class="lane-label" x="8" y="32">the assistant</text>
<rect class="lane lane--colleague" x="0" y="116" width="1534" height="100"/>
<text class="lane-label" x="8" y="132">a colleague</text>
<rect class="lane lane--rules" x="0" y="216" width="1534" height="100"/>
<text class="lane-label" x="8" y="232">the rules</text>
<path class="edge edge--enumerated" d="M225 266 H278 V66 H331" data-edge="alert-&gt;triage"/>
<path class="edge edge--enumerated" d="M375 66 H481" data-edge="triage-&gt;contact"/>
<path class="edge edge--enumerated" d="M525 66 H631" data-edge="contact-&gt;decision"/>
<path class="edge edge--enumerated" d="M675 66 H728 V266 H781" data-edge="decision-&gt;restriction"/>
<text class="edge-label" x="734" y="162" text-anchor="start">release / hold / block-card / freeze / escalate</text>
<path class="edge edge--case" d="M825 266 H878 V166 H931" data-edge="restriction-&gt;sar"/>
<text class="edge-label" x="884" y="212" text-anchor="start">depends on the case</text>
<path class="edge edge--enumerated" d="M975 166 H1028 V266 H1081" data-edge="sar-&gt;filing"/>
<text class="edge-label" x="1034" y="212" text-anchor="start">skip / file</text>
<path class="edge edge--enumerated" d="M1125 266 H1231" data-edge="filing-&gt;note"/>
<path class="edge edge--case" d="M1275 266 H1399" data-edge="note-&gt;end"/>
<text class="edge-label" x="1339" y="258" text-anchor="middle">depends on the case</text>
<line class="end" x1="1403" y1="24" x2="1403" y2="308"/>
<circle class="node node--rule" cx="203" cy="266" r="22" data-stage="alert"/>
<text class="node-label" x="203" y="302">Alert</text>
<circle class="node node--agent" cx="353" cy="66" r="22" data-stage="triage"/>
<text class="node-label" x="353" y="102">Triage</text>
<circle class="node node--agent" cx="503" cy="66" r="22" data-stage="contact"/>
<text class="node-label" x="503" y="102">Contact</text>
<circle class="node node--agent" cx="653" cy="66" r="22" data-stage="decision"/>
<text class="node-label" x="653" y="102">Decision</text>
<circle class="node node--rule" cx="803" cy="266" r="22" data-stage="restriction"/>
<text class="node-label" x="803" y="302">Restriction recorded</text>
<circle class="node node--human node--irreversible" cx="953" cy="166" r="22" data-stage="sar"/>
<text class="node-label" x="953" y="202">Suspicious-activity report</text>
<circle class="node node--rule" cx="1103" cy="266" r="22" data-stage="filing"/>
<text class="node-label" x="1103" y="302">Report filed</text>
<circle class="node node--rule" cx="1253" cy="266" r="22" data-stage="note"/>
<text class="node-label" x="1253" y="302">Closing note</text>
<circle class="point point--pre-think" cx="339" cy="34" r="5" data-point="loop:triage:pre-think"/>
<circle class="point point--pre-act" cx="353" cy="34" r="5" data-point="loop:triage:pre-act"/>
<circle class="point point--post-act" cx="367" cy="34" r="5" data-point="loop:triage:post-act"/>
<circle class="point point--pre-think" cx="489" cy="34" r="5" data-point="loop:contact:pre-think"/>
<circle class="point point--pre-act" cx="503" cy="34" r="5" data-point="loop:contact:pre-act"/>
<circle class="point point--post-act" cx="517" cy="34" r="5" data-point="loop:contact:post-act"/>
<circle class="point point--pre-think" cx="639" cy="34" r="5" data-point="loop:decision:pre-think"/>
<circle class="point point--pre-act" cx="653" cy="34" r="5" data-point="loop:decision:pre-act"/>
<circle class="point point--post-act" cx="667" cy="34" r="5" data-point="loop:decision:post-act"/>
</svg>
