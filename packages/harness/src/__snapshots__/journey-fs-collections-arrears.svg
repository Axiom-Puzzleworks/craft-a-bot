<text class="node-label" x="653" y="302">Reassess</text>
<circle class="node node--agent" cx="803" cy="66" r="22" data-stage="plan"/>
<text class="node-label" x="803" y="102">Plan</text>
<circle class="node node--rule" cx="953" cy="266" r="22" data-stage="record"/>
<text class="node-label" x="953" y="302">Plan recorded</text>
<circle class="node node--human" cx="1103" cy="166" r="22" data-stage="decision"/>
