<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1534 332" width="1534" height="332" role="img" aria-labelledby="journey-title" font-family="system-ui, sans-serif" font-size="11" fill="currentColor" stroke="currentColor">
<title id="journey-title">The arrears journey: Intake (the rules), Contact (the assistant), Circumstances (the assistant), Reassess (the rules), Plan (the assistant), Plan recorded (the rules), Decision (a colleague), Agreement (the assistant). Edges: intake to contact; contact to circumstances; circumstances to reassess on job-loss / bereavement / health / none; reassess to plan; plan to record on payment-plan / reduced-payments / breathing-space; record to decision on payment-plan / reduced-payments / breathing-space; decision to agree on confirm; decision to end on return; agree to end on depends on the case.</title>
<style>.lane{fill:none;stroke-opacity:.35}.lane-label{stroke:none;font-weight:700}.edge{fill:none;stroke-width:1.5}.edge--case{stroke-dasharray:4 3}.edge--taken{stroke-width:3}.edge-label{stroke:none}.node{fill:none;stroke-width:1.5}.node--lit{stroke-width:3}.node--irreversible{stroke-dasharray:2 2}.node-label{stroke:none;text-anchor:middle}.point{fill:none;stroke-width:1.5}.end{stroke-width:3}</style>
<rect class="lane lane--assistant" x="0" y="16" width="1534" height="100"/>
<text class="lane-label" x="8" y="32">the assistant</text>
<rect class="lane lane--colleague" x="0" y="116" width="1534" height="100"/>
<text class="lane-label" x="8" y="132">a colleague</text>
<rect class="lane lane--rules" x="0" y="216" width="1534" height="100"/>
<text class="lane-label" x="8" y="232">the rules</text>
<path class="edge edge--enumerated" d="M225 266 H278 V66 H331" data-edge="intake-&gt;contact"/>
<path class="edge edge--enumerated" d="M375 66 H481" data-edge="contact-&gt;circumstances"/>
<path class="edge edge--enumerated" d="M525 66 H578 V266 H631" data-edge="circumstances-&gt;reassess"/>
<text class="edge-label" x="584" y="162" text-anchor="start">job-loss / bereavement / health / none</text>
<path class="edge edge--enumerated" d="M675 266 H728 V66 H781" data-edge="reassess-&gt;plan"/>
<path class="edge edge--enumerated" d="M825 66 H878 V266 H931" data-edge="plan-&gt;record"/>
<text class="edge-label" x="884" y="162" text-anchor="start">payment-plan / reduced-payments / breathing-space</text>
<path class="edge edge--enumerated" d="M975 266 H1028 V166 H1081" data-edge="record-&gt;decision"/>
<text class="edge-label" x="1034" y="212" text-anchor="start">payment-plan / reduced-payments / breathing-space</text>
<path class="edge edge--enumerated" d="M1125 166 H1178 V66 H1231" data-edge="decision-&gt;agree"/>
<text class="edge-label" x="1184" y="112" text-anchor="start">confirm</text>
<path class="edge edge--enumerated" d="M1125 166 H1178 V128 H1399" data-edge="decision-&gt;end"/>
<text class="edge-label" x="1184" y="124" text-anchor="start">return</text>
<path class="edge edge--case" d="M1275 66 H1399" data-edge="agree-&gt;end"/>
<text class="edge-label" x="1339" y="58" text-anchor="middle">depends on the case</text>
<line class="end" x1="1403" y1="24" x2="1403" y2="308"/>
<circle class="node node--rule" cx="203" cy="266" r="22" data-stage="intake"/>
<text class="node-label" x="203" y="302">Intake</text>
<circle class="node node--agent" cx="353" cy="66" r="22" data-stage="contact"/>
<text class="node-label" x="353" y="102">Contact</text>
