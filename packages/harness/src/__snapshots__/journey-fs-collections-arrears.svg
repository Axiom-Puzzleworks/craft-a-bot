<circle class="point point--post-act" cx="817" cy="34" r="5" data-point="loop:plan:post-act"/>
<circle class="point point--pre-think" cx="1239" cy="34" r="5" data-point="loop:agree:pre-think"/>
<circle class="point point--pre-act" cx="1253" cy="34" r="5" data-point="loop:agree:pre-act"/>
