<path class="edge edge--enumerated" d="M525 66 H578 V266 H631" data-edge="classify-&gt;verify"/>
<text class="edge-label" x="584" y="162" text-anchor="start">address / card / third-party / disclosure / bereavement</text>
<path class="edge edge--enumerated" d="M675 266 H728 V66 H781" data-edge="verify-&gt;act"/>
<text class="edge-label" x="734" y="162" text-anchor="start">address / card / third-party</text>
<path class="edge edge--enumerated" d="M675 266 H728 V28 H953 V44" data-edge="verify-&gt;record"/>
<text class="edge-label" x="734" y="24" text-anchor="start">disclosure</text>
<path class="edge edge--enumerated" d="M675 266 H728 V128 H1103 V144" data-edge="verify-&gt;confirm"/>
<text class="edge-label" x="734" y="124" text-anchor="start">bereavement</text>
<path class="edge edge--enumerated" d="M825 66 H931" data-edge="act-&gt;record"/>
<text class="edge-label" x="878" y="58" text-anchor="middle">update-address / reissue-card / grant-third-party-access / close-account / none</text>
<path class="edge edge--case" d="M975 66 H1028 V28 H1253 V44" data-edge="record-&gt;close"/>
<text class="edge-label" x="1034" y="24" text-anchor="start">depends on the case</text>
<path class="edge edge--enumerated" d="M1103 188 V204 H953 V88" data-edge="confirm-&gt;record"/>
<text class="edge-label" x="1028" y="216" text-anchor="middle">confirm</text>
<path class="edge edge--enumerated" d="M1125 166 H1178 V128 H1399" data-edge="confirm-&gt;end"/>
<text class="edge-label" x="1184" y="124" text-anchor="start">return</text>
<path class="edge edge--case" d="M1275 66 H1399" data-edge="close-&gt;end"/>
<text class="edge-label" x="1339" y="58" text-anchor="middle">depends on the case</text>
<line class="end" x1="1403" y1="24" x2="1403" y2="308"/>
<circle class="node node--rule" cx="203" cy="266" r="22" data-stage="request"/>
<text class="node-label" x="203" y="302">Request</text>
<circle class="node node--agent" cx="353" cy="66" r="22" data-stage="identify"/>
<text class="node-label" x="353" y="102">Identify</text>
<circle class="node node--agent" cx="503" cy="66" r="22" data-stage="classify"/>
<text class="node-label" x="503" y="102">Classify</text>
