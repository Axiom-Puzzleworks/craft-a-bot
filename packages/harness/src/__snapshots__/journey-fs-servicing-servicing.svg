<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1534 332" width="1534" height="332" role="img" aria-labelledby="journey-title" font-family="system-ui, sans-serif" font-size="11" fill="currentColor" stroke="currentColor">
<title id="journey-title">The servicing journey: Request (the rules), Identify (the assistant), Classify (the assistant), Verify (the rules), Act (the assistant), Record (the assistant), Four eyes (a colleague), Closure (the assistant). Edges: request to identify; identify to classify; classify to verify on address / card / third-party / disclosure / bereavement; verify to act on address / card / third-party; verify to record on disclosure; verify to confirm on bereavement; act to record on update-address / reissue-card / grant-third-party-access / close-account / none; record to close on depends on the case; confirm to record on confirm; confirm to end on return; close to end on depends on the case.</title>
<style>.lane{fill:none;stroke-opacity:.35}.lane-label{stroke:none;font-weight:700}.edge{fill:none;stroke-width:1.5}.edge--case{stroke-dasharray:4 3}.edge--taken{stroke-width:3}.edge-label{stroke:none}.node{fill:none;stroke-width:1.5}.node--lit{stroke-width:3}.node--irreversible{stroke-dasharray:2 2}.node-label{stroke:none;text-anchor:middle}.point{fill:none;stroke-width:1.5}.end{stroke-width:3}</style>
<rect class="lane lane--assistant" x="0" y="16" width="1534" height="100"/>
<text class="lane-label" x="8" y="32">the assistant</text>
<rect class="lane lane--colleague" x="0" y="116" width="1534" height="100"/>
<text class="lane-label" x="8" y="132">a colleague</text>
<rect class="lane lane--rules" x="0" y="216" width="1534" height="100"/>
<text class="lane-label" x="8" y="232">the rules</text>
<path class="edge edge--enumerated" d="M225 266 H278 V66 H331" data-edge="request-&gt;identify"/>
