<circle class="point point--pre-act" cx="953" cy="34" r="5" data-point="loop:record:pre-act"/>
<circle class="point point--post-act" cx="967" cy="34" r="5" data-point="loop:record:post-act"/>
<circle class="point point--pre-think" cx="1239" cy="34" r="5" data-point="loop:close:pre-think"/>
<circle class="point point--pre-act" cx="1253" cy="34" r="5" data-point="loop:close:pre-act"/>
<circle class="point point--post-act" cx="1267" cy="34" r="5" data-point="loop:close:post-act"/>
