<circle class="point point--pre-act" cx="503" cy="34" r="5" data-point="loop:classify:pre-act"/>
<circle class="point point--post-act" cx="517" cy="34" r="5" data-point="loop:classify:post-act"/>
<circle class="point point--pre-think" cx="789" cy="34" r="5" data-point="loop:act:pre-think"/>
<circle class="point point--pre-act" cx="803" cy="34" r="5" data-point="loop:act:pre-act"/>
<circle class="point point--post-act" cx="817" cy="34" r="5" data-point="loop:act:post-act"/>
