<text class="node-label" x="653" y="302">Verify</text>
<circle class="node node--agent" cx="803" cy="66" r="22" data-stage="act"/>
<text class="node-label" x="803" y="102">Act</text>
<circle class="node node--agent" cx="953" cy="66" r="22" data-stage="record"/>
<text class="node-label" x="953" y="102">Record</text>
<circle class="node node--human" cx="1103" cy="166" r="22" data-stage="confirm"/>
<text class="node-label" x="1103" y="202">Four eyes</text>
<circle class="node node--agent node--irreversible" cx="1253" cy="66" r="22" data-stage="close"/>
