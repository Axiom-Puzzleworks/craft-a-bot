<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1834 432" width="1834" height="432" role="img" aria-labelledby="journey-title" font-family="system-ui, sans-serif" font-size="11" fill="currentColor" stroke="currentColor">
<title id="journey-title">The lending journey: Intake (the rules), Identity (the assistant), Bureau file (the systems), Affordability (the assistant), Decision (the assistant), Decision recorded (the rules), Explanation (the assistant), Four eyes (a colleague), Disbursement (the assistant), Appeal (the assistant). Edges: intake to identity; identity to bureau; bureau to affordability; affordability to decision; decision to record on approve / decline / refer; record to explanation on approve / decline / refer; explanation to four-eyes on depends on the case; four-eyes to disbursement on depends on the case; disbursement to appeal on depends on the case; appeal to end.</title>
<style>.lane{fill:none;stroke-opacity:.35}.lane-label{stroke:none;font-weight:700}.edge{fill:none;stroke-width:1.5}.edge--case{stroke-dasharray:4 3}.edge--taken{stroke-width:3}.edge-label{stroke:none}.node{fill:none;stroke-width:1.5}.node--lit{stroke-width:3}.node--irreversible{stroke-dasharray:2 2}.node-label{stroke:none;text-anchor:middle}.point{fill:none;stroke-width:1.5}.end{stroke-width:3}</style>
