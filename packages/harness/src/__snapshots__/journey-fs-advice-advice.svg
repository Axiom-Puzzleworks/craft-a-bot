<text class="node-label" x="653" y="102">Warnings</text>
<circle class="node node--human" cx="803" cy="166" r="22" data-stage="consent"/>
<text class="node-label" x="803" y="202">Consent</text>
<circle class="node node--agent node--irreversible" cx="953" cy="66" r="22" data-stage="execution"/>
