<path class="edge edge--case" d="M525 66 H631" data-edge="recommendation-&gt;warnings"/>
<text class="edge-label" x="578" y="58" text-anchor="middle">depends on the case</text>
<path class="edge edge--enumerated" d="M675 66 H728 V166 H781" data-edge="warnings-&gt;consent"/>
<path class="edge edge--enumerated" d="M825 166 H878 V66 H931" data-edge="consent-&gt;execution"/>
<text class="edge-label" x="884" y="112" text-anchor="start">proceed</text>
<path class="edge edge--enumerated" d="M825 166 H878 V228 H1103 V244" data-edge="consent-&gt;confirmation"/>
<text class="edge-label" x="884" y="224" text-anchor="start">decline</text>
<path class="edge edge--enumerated" d="M975 66 H1028 V266 H1081" data-edge="execution-&gt;confirmation"/>
<path class="edge edge--enumerated" d="M1125 266 H1249" data-edge="confirmation-&gt;end"/>
