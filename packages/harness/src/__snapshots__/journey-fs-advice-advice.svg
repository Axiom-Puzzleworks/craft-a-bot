<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1384 332" width="1384" height="332" role="img" aria-labelledby="journey-title" font-family="system-ui, sans-serif" font-size="11" fill="currentColor" stroke="currentColor">
<title id="journey-title">The advice journey: Request (the rules), Suitability (the assistant), Recommendation (the assistant), Warnings (the assistant), Consent (a colleague), Execution (the assistant), Confirmation (the rules). Edges: request to suitability; suitability to recommendation; recommendation to warnings on depends on the case; warnings to consent; consent to execution on proceed; consent to confirmation on decline; execution to confirmation; confirmation to end.</title>
<style>.lane{fill:none;stroke-opacity:.35}.lane-label{stroke:none;font-weight:700}.edge{fill:none;stroke-width:1.5}.edge--case{stroke-dasharray:4 3}.edge--taken{stroke-width:3}.edge-label{stroke:none}.node{fill:none;stroke-width:1.5}.node--lit{stroke-width:3}.node--irreversible{stroke-dasharray:2 2}.node-label{stroke:none;text-anchor:middle}.point{fill:none;stroke-width:1.5}.end{stroke-width:3}</style>
<rect class="lane lane--assistant" x="0" y="16" width="1384" height="100"/>
<text class="lane-label" x="8" y="32">the assistant</text>
<rect class="lane lane--colleague" x="0" y="116" width="1384" height="100"/>
<text class="lane-label" x="8" y="132">a colleague</text>
<rect class="lane lane--rules" x="0" y="216" width="1384" height="100"/>
<text class="lane-label" x="8" y="232">the rules</text>
<path class="edge edge--enumerated" d="M225 266 H278 V66 H331" data-edge="request-&gt;suitability"/>
