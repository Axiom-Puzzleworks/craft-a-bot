<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1384 332" width="1384" height="332" role="img" aria-labelledby="journey-title" font-family="system-ui, sans-serif" font-size="11" fill="currentColor" stroke="currentColor">
<title id="journey-title">The complaints journey: Acknowledgement (the assistant), Investigation (the rules), Root cause (the assistant), Decision (the rules), Approval (a colleague), Closed (the rules), Redress (the assistant). Edges: acknowledge to investigate; investigate to root-cause; root-cause to decision; decision to approve on uphold; decision to close on decline; approve to redress on confirm; approve to close on return; close to end; redress to close.</title>
<style>.lane{fill:none;stroke-opacity:.35}.lane-label{stroke:none;font-weight:700}.edge{fill:none;stroke-width:1.5}.edge--case{stroke-dasharray:4 3}.edge--taken{stroke-width:3}.edge-label{stroke:none}.node{fill:none;stroke-width:1.5}.node--lit{stroke-width:3}.node--irreversible{stroke-dasharray:2 2}.node-label{stroke:none;text-anchor:middle}.point{fill:none;stroke-width:1.5}.end{stroke-width:3}</style>
<rect class="lane lane--assistant" x="0" y="16" width="1384" height="100"/>
<text class="lane-label" x="8" y="32">the assistant</text>
<rect class="lane lane--colleague" x="0" y="116" width="1384" height="100"/>
<text class="lane-label" x="8" y="132">a colleague</text>
<rect class="lane lane--rules" x="0" y="216" width="1384" height="100"/>
<text class="lane-label" x="8" y="232">the rules</text>
<path class="edge edge--enumerated" d="M225 66 H278 V266 H331" data-edge="acknowledge-&gt;investigate"/>
<path class="edge edge--enumerated" d="M375 266 H428 V66 H481" data-edge="investigate-&gt;root-cause"/>
<path class="edge edge--enumerated" d="M525 66 H578 V266 H631" data-edge="root-cause-&gt;decision"/>
<path class="edge edge--enumerated" d="M675 266 H728 V166 H781" data-edge="decision-&gt;approve"/>
<text class="edge-label" x="734" y="212" text-anchor="start">uphold</text>
<path class="edge edge--enumerated" d="M675 266 H728 V228 H953 V244" data-edge="decision-&gt;close"/>
<text class="edge-label" x="734" y="224" text-anchor="start">decline</text>
<path class="edge edge--enumerated" d="M825 166 H878 V28 H1103 V44" data-edge="approve-&gt;redress"/>
<text class="edge-label" x="884" y="24" text-anchor="start">confirm</text>
<path class="edge edge--enumerated" d="M825 166 H878 V266 H931" data-edge="approve-&gt;close"/>
<text class="edge-label" x="884" y="212" text-anchor="start">return</text>
<path class="edge edge--enumerated" d="M975 266 H1028 V228 H1249" data-edge="close-&gt;end"/>
<path class="edge edge--enumerated" d="M1103 88 V104 H953 V288" data-edge="redress-&gt;close"/>
<line class="end" x1="1253" y1="24" x2="1253" y2="308"/>
<circle class="node node--agent" cx="203" cy="66" r="22" data-stage="acknowledge"/>
<text class="node-label" x="203" y="102">Acknowledgement</text>
<circle class="node node--rule" cx="353" cy="266" r="22" data-stage="investigate"/>
<text class="node-label" x="353" y="302">Investigation</text>
<circle class="node node--agent" cx="503" cy="66" r="22" data-stage="root-cause"/>
<text class="node-label" x="503" y="102">Root cause</text>
<circle class="node node--rule" cx="653" cy="266" r="22" data-stage="decision"/>
<text class="node-label" x="653" y="302">Decision</text>
<circle class="node node--human" cx="803" cy="166" r="22" data-stage="approve"/>
<text class="node-label" x="803" y="202">Approval</text>
<circle class="node node--rule" cx="953" cy="266" r="22" data-stage="close"/>
<text class="node-label" x="953" y="302">Closed</text>
<circle class="node node--agent node--irreversible" cx="1103" cy="66" r="22" data-stage="redress"/>
<text class="node-label" x="1103" y="102">Redress</text>
<circle class="point point--pre-think" cx="189" cy="34" r="5" data-point="loop:acknowledge:pre-think"/>
<circle class="point point--pre-act" cx="203" cy="34" r="5" data-point="loop:acknowledge:pre-act"/>
<circle class="point point--post-act" cx="217" cy="34" r="5" data-point="loop:acknowledge:post-act"/>
<circle class="point point--pre-think" cx="489" cy="34" r="5" data-point="loop:root-cause:pre-think"/>
<circle class="point point--pre-act" cx="503" cy="34" r="5" data-point="loop:root-cause:pre-act"/>
<circle class="point point--post-act" cx="517" cy="34" r="5" data-point="loop:root-cause:post-act"/>
<circle class="point point--pre-think" cx="1089" cy="34" r="5" data-point="loop:redress:pre-think"/>
<circle class="point point--pre-act" cx="1103" cy="34" r="5" data-point="loop:redress:pre-act"/>
<circle class="point point--post-act" cx="1117" cy="34" r="5" data-point="loop:redress:post-act"/>
<rect class="point point--stage-in" x="1064" y="61" width="10" height="10" data-point="boundary:redress:stage-in"/>
</svg>
