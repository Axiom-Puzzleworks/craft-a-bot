<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1684 332" width="1684" height="332" role="img" aria-labelledby="journey-title" font-family="system-ui, sans-serif" font-size="11" fill="currentColor" stroke="currentColor">
<title id="journey-title">The disputes journey: Intake (the rules), Verify (the assistant), Classify (the assistant), Hold (the rules), Investigate (the assistant), Decision (the assistant), Decision recorded (the rules), Four eyes (a colleague), Reimbursement (the assistant). Edges: intake to verify; verify to classify; classify to hold on unauthorised / authorised-scam / merchant; hold to investigate; investigate to decision; decision to record on reimburse / decline / refer; record to confirm on depends on the case; confirm to reimburse on confirm; confirm to end on return; reimburse to end on depends on the case.</title>
<style>.lane{fill:none;stroke-opacity:.35}.lane-label{stroke:none;font-weight:700}.edge{fill:none;stroke-width:1.5}.edge--case{stroke-dasharray:4 3}.edge--taken{stroke-width:3}.edge-label{stroke:none}.node{fill:none;stroke-width:1.5}.node--lit{stroke-width:3}.node--irreversible{stroke-dasharray:2 2}.node-label{stroke:none;text-anchor:middle}.point{fill:none;stroke-width:1.5}.end{stroke-width:3}</style>
<rect class="lane lane--assistant" x="0" y="16" width="1684" height="100"/>
<text class="lane-label" x="8" y="32">the assistant</text>
<rect class="lane lane--colleague" x="0" y="116" width="1684" height="100"/>
<text class="lane-label" x="8" y="132">a colleague</text>
<rect class="lane lane--rules" x="0" y="216" width="1684" height="100"/>
<text class="lane-label" x="8" y="232">the rules</text>
<path class="edge edge--enumerated" d="M225 266 H278 V66 H331" data-edge="intake-&gt;verify"/>
<path class="edge edge--enumerated" d="M375 66 H481" data-edge="verify-&gt;classify"/>
<path class="edge edge--enumerated" d="M525 66 H578 V266 H631" data-edge="classify-&gt;hold"/>
<text class="edge-label" x="584" y="162" text-anchor="start">unauthorised / authorised-scam / merchant</text>
<path class="edge edge--enumerated" d="M675 266 H728 V66 H781" data-edge="hold-&gt;investigate"/>
<path class="edge edge--enumerated" d="M825 66 H931" data-edge="investigate-&gt;decision"/>
<path class="edge edge--enumerated" d="M975 66 H1028 V266 H1081" data-edge="decision-&gt;record"/>
<text class="edge-label" x="1034" y="162" text-anchor="start">reimburse / decline / refer</text>
<path class="edge edge--case" d="M1125 266 H1178 V166 H1231" data-edge="record-&gt;confirm"/>
<text class="edge-label" x="1184" y="212" text-anchor="start">depends on the case</text>
<path class="edge edge--enumerated" d="M1275 166 H1328 V66 H1381" data-edge="confirm-&gt;reimburse"/>
<text class="edge-label" x="1334" y="112" text-anchor="start">confirm</text>
<path class="edge edge--enumerated" d="M1275 166 H1328 V128 H1549" data-edge="confirm-&gt;end"/>
<text class="edge-label" x="1334" y="124" text-anchor="start">return</text>
<path class="edge edge--case" d="M1425 66 H1549" data-edge="reimburse-&gt;end"/>
<text class="edge-label" x="1489" y="58" text-anchor="middle">depends on the case</text>
<line class="end" x1="1553" y1="24" x2="1553" y2="308"/>
<circle class="node node--rule" cx="203" cy="266" r="22" data-stage="intake"/>
<text class="node-label" x="203" y="302">Intake</text>
<circle class="node node--agent" cx="353" cy="66" r="22" data-stage="verify"/>
<text class="node-label" x="353" y="102">Verify</text>
<circle class="node node--agent" cx="503" cy="66" r="22" data-stage="classify"/>
<text class="node-label" x="503" y="102">Classify</text>
<circle class="node node--rule" cx="653" cy="266" r="22" data-stage="hold"/>
<text class="node-label" x="653" y="302">Hold</text>
<circle class="node node--agent" cx="803" cy="66" r="22" data-stage="investigate"/>
<text class="node-label" x="803" y="102">Investigate</text>
<circle class="node node--agent" cx="953" cy="66" r="22" data-stage="decision"/>
<text class="node-label" x="953" y="102">Decision</text>
<circle class="node node--rule" cx="1103" cy="266" r="22" data-stage="record"/>
<text class="node-label" x="1103" y="302">Decision recorded</text>
<circle class="node node--human" cx="1253" cy="166" r="22" data-stage="confirm"/>
<text class="node-label" x="1253" y="202">Four eyes</text>
<circle class="node node--agent node--irreversible" cx="1403" cy="66" r="22" data-stage="reimburse"/>
<text class="node-label" x="1403" y="102">Reimbursement</text>
<circle class="point point--pre-think" cx="339" cy="34" r="5" data-point="loop:verify:pre-think"/>
<circle class="point point--pre-act" cx="353" cy="34" r="5" data-point="loop:verify:pre-act"/>
<circle class="point point--post-act" cx="367" cy="34" r="5" data-point="loop:verify:post-act"/>
<circle class="point point--pre-think" cx="489" cy="34" r="5" data-point="loop:classify:pre-think"/>
<circle class="point point--pre-act" cx="503" cy="34" r="5" data-point="loop:classify:pre-act"/>
<circle class="point point--post-act" cx="517" cy="34" r="5" data-point="loop:classify:post-act"/>
<circle class="point point--pre-think" cx="789" cy="34" r="5" data-point="loop:investigate:pre-think"/>
<circle class="point point--pre-act" cx="803" cy="34" r="5" data-point="loop:investigate:pre-act"/>
<circle class="point point--post-act" cx="817" cy="34" r="5" data-point="loop:investigate:post-act"/>
<circle class="point point--pre-think" cx="939" cy="34" r="5" data-point="loop:decision:pre-think"/>
<circle class="point point--pre-act" cx="953" cy="34" r="5" data-point="loop:decision:pre-act"/>
<circle class="point point--post-act" cx="967" cy="34" r="5" data-point="loop:decision:post-act"/>
<circle class="point point--pre-think" cx="1389" cy="34" r="5" data-point="loop:reimburse:pre-think"/>
<circle class="point point--pre-act" cx="1403" cy="34" r="5" data-point="loop:reimburse:pre-act"/>
<circle class="point point--post-act" cx="1417" cy="34" r="5" data-point="loop:reimburse:post-act"/>
</svg>
